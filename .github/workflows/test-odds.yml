name: Test NFL Odds Collector

on:
  workflow_dispatch:

jobs:
  test-odds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r odds/requirements.txt

      - name: Run odds collector
        run: |
          python odds/collect_props.py
