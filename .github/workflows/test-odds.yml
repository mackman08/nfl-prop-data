name: NFL Odds Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "7 9,12,15,18 * * *"
      timezone: "America/Toronto"

permissions:
  contents: write

jobs:
  collect-odds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r odds/requirements.txt

      - name: Run odds collector
        run: |
          python odds/collect_props.py

      - name: Validate latest odds
        run: |
          python odds/validate_props.py

      - name: Save latest odds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add odds/nfl_player_props_latest.csv
          git add odds/nfl_player_props_summary.json

          if git diff --cached --quiet; then
            echo "No odds changes to commit."
          else
            git commit -m "Update latest NFL player props"
            git push
          fi
