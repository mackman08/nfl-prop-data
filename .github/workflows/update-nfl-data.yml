name: Build NFL Prop Data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 2'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Determine current NFL season
        id: season
        run: |
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%m)

          # NFL season belongs to the calendar year in which it starts.
          # January-June = previous year's NFL season.
          if [ "$MONTH" -le 6 ]; then
            CURRENT_SEASON=$((YEAR - 1))
          else
            CURRENT_SEASON=$YEAR
          fi

          PREVIOUS_SEASON=$((CURRENT_SEASON - 1))

          echo "current_season=$CURRENT_SEASON" >> "$GITHUB_OUTPUT"
          echo "previous_season=$PREVIOUS_SEASON" >> "$GITHUB_OUTPUT"

          echo "Current NFL season: $CURRENT_SEASON"
          echo "Previous NFL season: $PREVIOUS_SEASON"

      - name: Download current NFL player stats
        run: |
          CURRENT="${{ steps.season.outputs.current_season }}"
          PREVIOUS="${{ steps.season.outputs.previous_season }}"

          wget -O "stats_player_week_${PREVIOUS}.csv" \
            "https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_${PREVIOUS}.csv"

          wget -O "stats_player_week_${CURRENT}.csv" \
            "https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_${CURRENT}.csv"

          ls -lh stats_player_week_*.csv

      - name: Install Python packages
        run: |
          pip install pandas

      - name: Build compact model input
        run: |
          python - <<'PY'
          import pandas as pd
          import json
          import os
          import glob

          files = sorted(glob.glob("stats_player_week_*.csv"))

          if len(files) != 2:
              raise RuntimeError(
                  f"Expected exactly 2 weekly player-stat files, found: {files}"
              )

          frames = []

          for file in files:
              print(f"Reading {file}")
              temp = pd.read_csv(file)
              frames.append(temp)

          df = pd.concat(frames, ignore_index=True)

          print(f"Raw rows: {len(df):,}")
          print("Available columns:")
          print(list(df.columns))

          # Regular season + relevant skill positions
          df = df[
              (df["season_type"] == "REG") &
              (df["position"].isin(["QB", "RB", "WR", "TE"]))
          ].copy()

          # Required model fields
          columns = [
              "player_id",
              "player_name",
              "position",
              "season",
              "week",
              "game_id",
              "team",
              "opponent_team",
              "passing_yards",
              "rushing_yards",
              "receiving_yards",
              "receptions"
          ]

          # Keep fields that exist in the current nflverse schema
          available = [c for c in columns if c in df.columns]
          df = df[available]

          print("Model columns:")
          print(list(df.columns))

          # Missing statistical categories = 0
          for col in [
              "passing_yards",
              "rushing_yards",
              "receiving_yards",
              "receptions"
          ]:
              if col in df.columns:
                  df[col] = df[col].fillna(0)

          # Ensure chronological ordering
          sort_columns = [
              c for c in [
                  "player_id",
                  "season",
                  "week",
                  "game_id"
              ]
              if c in df.columns
          ]

          df = df.sort_values(sort_columns)

          # Keep each player's latest 10 regular-season games
          df = (
              df.groupby("player_id", group_keys=False)
                .tail(10)
          )

          # Output one connector-readable text file
          os.makedirs("data", exist_ok=True)

          output = "data/nfl_prop_model.txt"

          with open(output, "w") as f:
              for record in df.to_dict("records"):
                  f.write(
                      json.dumps(
                          record,
                          separators=(",", ":"),
                          default=str
                      ) + "\n"
                  )

          print()
          print("===== MODEL DATA SUMMARY =====")
          print(
              f"Seasons: "
              f"{df['season'].min()}-{df['season'].max()}"
          )
          print(f"Rows: {len(df):,}")
          print(f"Players: {df['player_id'].nunique():,}")

          if "week" in df.columns:
              print(f"Latest week in file: {df['week'].max()}")

          if "team" in df.columns:
              print("Team column: YES")
          else:
              print("Team column: NO")

          if "game_id" in df.columns:
              print("Game ID column: YES")
          else:
              print("Game ID column: NO")

          PY

      - name: Verify output
        run: |
          echo "Output file:"
          ls -lh data/nfl_prop_model.txt

          echo
          echo "Number of game rows:"
          wc -l data/nfl_prop_model.txt

          echo
          echo "First 5 records:"
          head -5 data/nfl_prop_model.txt

          echo
          echo "Latest season/week represented:"
          python - <<'PY'
          import json

          seasons = []
          weeks = []

          with open("data/nfl_prop_model.txt") as f:
              for line in f:
                  row = json.loads(line)
                  seasons.append(int(row["season"]))
                  weeks.append(int(row["week"]))

          print("Max season:", max(seasons))
          print("Max week:", max(weeks))
          print("Min season:", min(seasons))
          PY

      - name: Commit model data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/nfl_prop_model.txt

          git diff --cached --quiet || \
            git commit -m "Update NFL prop model data"

          git push
