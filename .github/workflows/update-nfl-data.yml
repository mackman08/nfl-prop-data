name: Download NFL Data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 2'

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Download nflverse player stats
        run: |
          wget -O player_stats.parquet \
            https://github.com/nflverse/nflverse-data/releases/download/player_stats/player_stats.parquet

      - name: Verify download
        run: |
          ls -lh player_stats.parquet
          file player_stats.parquet
