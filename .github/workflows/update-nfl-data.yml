name: Build NFL Prop Data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 2'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Determine NFL seasons
        id: season
        run: |
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%m)

          if [ "$MONTH" -le 6 ]; then
            CURRENT_SEASON=$((YEAR - 1))
          else
            CURRENT_SEASON=$YEAR
          fi

          PREVIOUS_SEASON=$((CURRENT_SEASON - 1))

          echo "current_season=$CURRENT_SEASON" >> "$GITHUB_OUTPUT"
          echo "previous_season=$PREVIOUS_SEASON" >> "$GITHUB_OUTPUT"

          echo "Current season: $CURRENT_SEASON"
          echo "Previous season: $PREVIOUS_SEASON"

      - name: Download weekly player stats
        run: |
          CURRENT="${{ steps.season.outputs.current_season }}"
          PREVIOUS="${{ steps.season.outputs.previous_season }}"

          wget -O "stats_player_week_${PREVIOUS}.csv" \
            "https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_${PREVIOUS}.csv"

          wget -O "stats_player_week_${CURRENT}.csv" \
            "https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_${CURRENT}.csv"

          ls -lh stats_player_week_*.csv

      - name: Install Python
        run: |
          pip install pandas

      - name: Build compact one-file model
        run: |
          python - <<'PY'
          import pandas as pd
          import json
          import os

          current_season = int("${{ steps.season.outputs.current_season }}")
          previous_season = int("${{ steps.season.outputs.previous_season }}")

          # Maximum historical game window retained per player.
          #
          # The prop model can use shorter dynamic windows:
          #   L5  -> L10 stability check
          #   L10 -> L20 stability check
          #
          # Keeping 20 games here allows the current L10/L20 framework
          # while preserving the raw game-level data for dynamic analysis.
          HISTORY_GAMES = 20

          files = [
              f"stats_player_week_{previous_season}.csv",
              f"stats_player_week_{current_season}.csv"
          ]

          frames = []

          for file in files:
              print(f"Reading {file}")
              frames.append(pd.read_csv(file))

          df = pd.concat(frames, ignore_index=True)

          print(f"Raw rows: {len(df):,}")

          # ------------------------------------------------------------
          # Regular season and relevant positions only
          # ------------------------------------------------------------

          df = df[
              (df["season_type"] == "REG") &
              (df["position"].isin(["QB", "RB", "WR", "TE"]))
          ].copy()

          # ------------------------------------------------------------
          # Only retain players who have actually appeared in the
          # current season.
          #
          # Their prior-season games can still be used to complete
          # the historical window.
          # ------------------------------------------------------------

          current_players = set(
              df.loc[
                  df["season"] == current_season,
                  "player_id"
              ].dropna()
          )

          df = df[df["player_id"].isin(current_players)].copy()

          # ------------------------------------------------------------
          # Required model columns
          # ------------------------------------------------------------

          columns = [
              "player_id",
              "player_name",
              "position",
              "season",
              "week",
              "game_id",
              "team",
              "opponent_team",
              "passing_yards",
              "rushing_yards",
              "receiving_yards",
              "receptions"
          ]

          available = [c for c in columns if c in df.columns]

          df = df[available].copy()

          print("Available model columns:")
          print(available)

          # ------------------------------------------------------------
          # Fail rather than silently producing incomplete history
          # ------------------------------------------------------------

          required = [
              "player_id",
              "player_name",
              "position",
              "season",
              "week",
              "passing_yards",
              "rushing_yards",
              "receiving_yards",
              "receptions"
          ]

          missing = [c for c in required if c not in df.columns]

          if missing:
              raise RuntimeError(
                  f"Missing required columns: {missing}"
              )

          # ------------------------------------------------------------
          # Missing statistical categories = zero
          # ------------------------------------------------------------

          for col in [
              "passing_yards",
              "rushing_yards",
              "receiving_yards",
              "receptions"
          ]:
              df[col] = df[col].fillna(0)

          # ------------------------------------------------------------
          # Sort chronologically
          # ------------------------------------------------------------

          sort_columns = [
              "player_id",
              "season",
              "week"
          ]

          if "game_id" in df.columns:
              sort_columns.append("game_id")

          df = df.sort_values(sort_columns)

          # ------------------------------------------------------------
          # Keep each player's 20 most recent games.
          #
          # IMPORTANT:
          # We retain raw game-level results rather than calculating
          # L5/L10/L20 metrics here. The analysis prompt can therefore
          # dynamically choose its historical window.
          # ------------------------------------------------------------

          df = (
              df.groupby("player_id", group_keys=False)
                .tail(HISTORY_GAMES)
          )

          # ------------------------------------------------------------
          # One compact JSON object per player
          # ------------------------------------------------------------

          players = []

          for player_id, group in df.groupby("player_id", sort=False):

              group = group.sort_values(
                  ["season", "week"] +
                  (["game_id"] if "game_id" in group.columns else [])
              )

              latest = group.iloc[-1]

              player = {
                  "player_id": str(player_id),
                  "player_name": str(latest["player_name"]),
                  "position": str(latest["position"]),
                  "games": []
              }

              for _, row in group.iterrows():

                  game = {
                      "season": int(row["season"]),
                      "week": int(row["week"])
                  }

                  if "game_id" in row and pd.notna(row["game_id"]):
                      game["game_id"] = str(row["game_id"])

                  if "team" in row and pd.notna(row["team"]):
                      game["team"] = str(row["team"])

                  if "opponent_team" in row and pd.notna(row["opponent_team"]):
                      game["opponent_team"] = str(row["opponent_team"])

                  game["passing_yards"] = float(row["passing_yards"])
                  game["rushing_yards"] = float(row["rushing_yards"])
                  game["receiving_yards"] = float(row["receiving_yards"])
                  game["receptions"] = float(row["receptions"])

                  player["games"].append(game)

              players.append(player)

          # ------------------------------------------------------------
          # Sort players alphabetically for reproducibility
          # ------------------------------------------------------------

          players.sort(
              key=lambda x: (
                  x["position"],
                  x["player_name"]
              )
          )

          # ------------------------------------------------------------
          # Write output
          # ------------------------------------------------------------

          os.makedirs("data", exist_ok=True)

          output = "data/nfl_prop_model.txt"

          with open(output, "w") as f:
              for player in players:
                  f.write(
                      json.dumps(
                          player,
                          separators=(",", ":")
                      ) + "\n"
                  )

          # ------------------------------------------------------------
          # Summary
          # ------------------------------------------------------------

          total_games = sum(
              len(player["games"])
              for player in players
          )

          game_counts = [
              len(player["games"])
              for player in players
          ]

          players_with_less_than_history = sum(
              count < HISTORY_GAMES
              for count in game_counts
          )

          print()
          print("===== MODEL DATA SUMMARY =====")
          print(f"Seasons available: {previous_season}, {current_season}")
          print(f"Current-season players: {len(players):,}")
          print(f"Output rows: {len(players):,}")
          print(f"Maximum games retained per player: {HISTORY_GAMES}")
          print(f"Total game records retained: {total_games:,}")
          print(
              f"Players with fewer than {HISTORY_GAMES} games: "
              f"{players_with_less_than_history:,}"
          )

          PY

      - name: Verify output
        run: |
          echo "File size:"
          ls -lh data/nfl_prop_model.txt

          echo
          echo "Player objects:"
          wc -l data/nfl_prop_model.txt

          echo
          echo "First player:"
          head -1 data/nfl_prop_model.txt

      - name: Commit model data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/nfl_prop_model.txt

          git diff --cached --quiet || \
            git commit -m "Update NFL prop model data"

          git push
