name: Build NFL Prop Data

on:
  push:
    paths:
      - ".github/workflows/update-nfl-data.yml"
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 2'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Determine NFL seasons
        id: season
        run: |
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%m)

          if [ "$MONTH" -le 6 ]; then
            CURRENT_SEASON=$((YEAR - 1))
          else
            CURRENT_SEASON=$YEAR
          fi

          PREVIOUS_SEASON=$((CURRENT_SEASON - 1))
          TWO_SEASONS_BACK=$((CURRENT_SEASON - 2))

          echo "current_season=$CURRENT_SEASON" >> "$GITHUB_OUTPUT"
          echo "previous_season=$PREVIOUS_SEASON" >> "$GITHUB_OUTPUT"
          echo "two_seasons_back=$TWO_SEASONS_BACK" >> "$GITHUB_OUTPUT"

          echo "Current season: $CURRENT_SEASON"
          echo "Previous season: $PREVIOUS_SEASON"
          echo "Two seasons back: $TWO_SEASONS_BACK"

      - name: Download weekly player stats
        run: |
          CURRENT="${{ steps.season.outputs.current_season }}"
          PREVIOUS="${{ steps.season.outputs.previous_season }}"
          TWO_BACK="${{ steps.season.outputs.two_seasons_back }}"

          wget -O "stats_player_week_${TWO_BACK}.csv" \
            "https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_${TWO_BACK}.csv"

          wget -O "stats_player_week_${PREVIOUS}.csv" \
            "https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_${PREVIOUS}.csv"

          wget -O "stats_player_week_${CURRENT}.csv" \
            "https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_${CURRENT}.csv"

          ls -lh stats_player_week_*.csv

      - name: Install Python
        run: |
          pip install pandas

      - name: Build compact one-file model
        run: |
          python - <<'PY'
          import json
          import os
          import pandas as pd

          current_season = int("${{ steps.season.outputs.current_season }}")
          previous_season = int("${{ steps.season.outputs.previous_season }}")
          two_seasons_back = int("${{ steps.season.outputs.two_seasons_back }}")

          HISTORY_GAMES = 20

          files = [
              f"stats_player_week_{two_seasons_back}.csv",
              f"stats_player_week_{previous_season}.csv",
              f"stats_player_week_{current_season}.csv",
          ]

          frames = []

          for file in files:
              print(f"Reading {file}")
              frames.append(pd.read_csv(file))

          df = pd.concat(frames, ignore_index=True)

          print(f"Raw rows: {len(df):,}")

          # Regular season and supported positions only.
          df = df[
              (df["season_type"] == "REG") &
              (df["position"].isin(["QB", "RB", "WR", "TE"]))
          ].copy()

          # Retain only players who have actually appeared in the
          # current season. Prior-season games may complete history.
          current_players = set(
              df.loc[
                  df["season"] == current_season,
                  "player_id"
              ].dropna()
          )

          df = df[df["player_id"].isin(current_players)].copy()

          # Exact field set required by the analysis prompt.
          columns = [
              "player_id",
              "player_name",
              "position",
              "season",
              "week",
              "game_id",
              "team",
              "opponent_team",
              "passing_yards",
              "rushing_yards",
              "receiving_yards",
              "receptions"
          ]

          missing = [c for c in columns if c not in df.columns]

          if missing:
              raise RuntimeError(
                  f"Missing required source columns: {missing}"
              )

          df = df[columns].copy()

          # Identity and game-context fields must be present.
          required_identity = [
              "player_id",
              "player_name",
              "position",
              "season",
              "week",
              "game_id",
              "team",
              "opponent_team"
          ]

          for col in required_identity:
              if df[col].isna().any():
                  raise RuntimeError(
                      f"Null values found in required field: {col}"
                  )

          # Missing statistical categories represent zero production.
          stat_columns = [
              "passing_yards",
              "rushing_yards",
              "receiving_yards",
              "receptions"
          ]

          for col in stat_columns:
              df[col] = df[col].fillna(0)

          # Sort chronologically before taking the most recent 20 games.
          df = df.sort_values(
              ["player_id", "season", "week", "game_id"]
          )

          df = (
              df.groupby("player_id", group_keys=False)
                .tail(HISTORY_GAMES)
          )

          # Preserve the prompt's exact field names while using a fixed
          # array schema to keep the JSONL artifact comfortably small.
          GAME_FIELDS = [
              "season",
              "week",
              "game_id",
              "team",
              "opponent_team",
              "passing_yards",
              "rushing_yards",
              "receiving_yards",
              "receptions"
          ]

          players = []

          for player_id, group in df.groupby("player_id", sort=False):
              group = group.sort_values(
                  ["season", "week", "game_id"]
              )

              latest = group.iloc[-1]

              games = []

              for _, row in group.iterrows():

                  def clean_stat(value):
                      value = float(value)
                      return int(value) if value.is_integer() else value

                  games.append([
                      int(row["season"]),
                      int(row["week"]),
                      str(row["game_id"]),
                      str(row["team"]),
                      str(row["opponent_team"]),
                      clean_stat(row["passing_yards"]),
                      clean_stat(row["rushing_yards"]),
                      clean_stat(row["receiving_yards"]),
                      clean_stat(row["receptions"])
                  ])

              players.append({
                  "player_id": str(player_id),
                  "player_name": str(latest["player_name"]),
                  "position": str(latest["position"]),
                  "game_fields": GAME_FIELDS,
                  "games": games
              })

          players.sort(
              key=lambda x: (
                  x["position"],
                  x["player_name"]
              )
          )

          os.makedirs("data", exist_ok=True)
          output = "data/nfl_prop_model.txt"

          with open(
              output,
              "w",
              encoding="utf-8",
              newline="\n"
          ) as f:
              for player in players:
                  f.write(
                      json.dumps(
                          player,
                          separators=(",", ":"),
                          ensure_ascii=False
                      ) + "\n"
                  )

          # ------------------------------------------------------------
          # Full integrity validation before the file may be committed.
          # ------------------------------------------------------------

          with open(output, "r", encoding="utf-8") as f:
              lines = [line.rstrip("\n") for line in f if line.strip()]

          if not lines:
              raise RuntimeError(
                  "Generated nfl_prop_model.txt is empty"
              )

          required_game_fields = GAME_FIELDS
          parsed_players = []

          for line_number, line in enumerate(lines, start=1):
              try:
                  player = json.loads(line)
              except json.JSONDecodeError as exc:
                  raise RuntimeError(
                      f"Invalid JSON on line {line_number}: {exc}"
                  )

              required_player_fields = [
                  "player_id",
                  "player_name",
                  "position",
                  "game_fields",
                  "games"
              ]

              for key in required_player_fields:
                  if key not in player:
                      raise RuntimeError(
                          f"Missing required player field '{key}' "
                          f"on line {line_number}"
                      )

              if player["game_fields"] != required_game_fields:
                  raise RuntimeError(
                      f"Unexpected game_fields on line {line_number}"
                  )

              games = player["games"]

              if len(games) == 0:
                  raise RuntimeError(
                      f"Player has no game records on line {line_number}: "
                      f"{player['player_name']}"
                  )

              if len(games) > HISTORY_GAMES:
                  raise RuntimeError(
                      f"Player exceeds {HISTORY_GAMES} retained games: "
                      f"{player['player_name']}"
                  )

              seen_game_ids = set()
              previous_key = None

              for game in games:
                  if len(game) != len(required_game_fields):
                      raise RuntimeError(
                          f"Invalid game record length for "
                          f"{player['player_name']}"
                      )

                  game_id = str(game[2])

                  if game_id in seen_game_ids:
                      raise RuntimeError(
                          f"Duplicate game_id for "
                          f"{player['player_name']}: {game_id}"
                      )

                  seen_game_ids.add(game_id)

                  current_key = (
                      int(game[0]),
                      int(game[1]),
                      game_id
                  )

                  if previous_key is not None and current_key < previous_key:
                      raise RuntimeError(
                          f"Game records are not chronologically sorted for "
                          f"{player['player_name']}"
                      )

                  previous_key = current_key

              parsed_players.append(player)

          seasons = {
              int(game[0])
              for player in parsed_players
              for game in player["games"]
          }

          required_seasons = {
              two_seasons_back,
              previous_season,
              current_season
          }

          if not required_seasons.issubset(seasons):
              raise RuntimeError(
                  "Generated model is missing one or more expected seasons. "
                  f"Expected at least {sorted(required_seasons)}, "
                  f"found {sorted(seasons)}"
              )

          byte_size = os.path.getsize(output)

          # Keep the artifact safely below the retrieval boundary that
          # caused the previous empty-read failure.
          MAX_MODEL_BYTES = 900_000

          if byte_size > MAX_MODEL_BYTES:
              raise RuntimeError(
                  f"{output} is {byte_size:,} bytes, above the "
                  f"{MAX_MODEL_BYTES:,}-byte safety ceiling"
              )

          total_games = sum(
              len(player["games"])
              for player in parsed_players
          )

          game_counts = [
              len(player["games"])
              for player in parsed_players
          ]

          players_with_less_than_history = sum(
              count < HISTORY_GAMES
              for count in game_counts
          )

          print()
          print("===== MODEL DATA SUMMARY =====")
          print(
              "Seasons available: "
              f"{two_seasons_back}, {previous_season}, {current_season}"
          )
          print(f"Current-season players: {len(parsed_players):,}")
          print(f"Output rows: {len(parsed_players):,}")
          print(f"Maximum games retained per player: {HISTORY_GAMES}")
          print(f"Total game records retained: {total_games:,}")
          print(
              f"Players with fewer than {HISTORY_GAMES} games: "
              f"{players_with_less_than_history:,}"
          )
          print(f"Output size: {byte_size:,} bytes")
          print("Validation: PASSED")

          PY

      - name: Verify output
        run: |
          echo "File size:"
          ls -lh data/nfl_prop_model.txt

          echo
          echo "Player objects:"
          wc -l data/nfl_prop_model.txt

          echo
          echo "First player:"
          head -1 data/nfl_prop_model.txt

      - name: Commit model data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/nfl_prop_model.txt

          git diff --cached --quiet || \
            git commit -m "Update NFL prop model data"

          git push
