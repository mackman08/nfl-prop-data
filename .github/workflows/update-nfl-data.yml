name: Build NFL Prop Data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 2'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download nflverse player stats
        run: |
          wget -O player_stats.parquet \
            https://github.com/nflverse/nflverse-data/releases/download/player_stats/player_stats.parquet

      - name: Install Python packages
        run: |
          pip install pandas pyarrow

      - name: Build compact model input
        run: |
          python - <<'PY'
          import pandas as pd
          import json
          import os

          # Load nflverse player stats
          df = pd.read_parquet("player_stats.parquet")

          print("Original columns:")
          print(list(df.columns))

          # Regular season + relevant positions only
          df = df[
              (df["season_type"] == "REG") &
              (df["position"].isin(["QB", "RB", "WR", "TE"]))
          ].copy()

          # Keep only the two most recent seasons
          latest_season = int(df["season"].max())
          earliest_season = latest_season - 1

          df = df[
              df["season"].between(earliest_season, latest_season)
          ].copy()

          # Fields required by the prop model
          columns = [
              "player_id",
              "player_name",
              "position",
              "season",
              "week",
              "game_id",
              "team",
              "opponent_team",
              "passing_yards",
              "rushing_yards",
              "receiving_yards",
              "receptions"
          ]

          # Keep only fields that actually exist
          df = df[[c for c in columns if c in df.columns]]

          print("Model columns:")
          print(list(df.columns))

          # Missing statistical categories = 0
          for col in [
              "passing_yards",
              "rushing_yards",
              "receiving_yards",
              "receptions"
          ]:
              if col in df.columns:
                  df[col] = df[col].fillna(0)

          # Sort using only columns that exist
          sort_columns = [
              c for c in [
                  "player_id",
                  "season",
                  "week",
                  "game_id"
              ]
              if c in df.columns
          ]

          df = df.sort_values(sort_columns)

          # Keep the most recent 10 games for every player
          df = (
              df.groupby("player_id", group_keys=False)
                .tail(10)
          )

          # Create output directory
          os.makedirs("data", exist_ok=True)

          # One compact JSON Lines text file
          with open("data/nfl_prop_model.txt", "w") as f:
              for record in df.to_dict("records"):
                  f.write(
                      json.dumps(
                          record,
                          separators=(",", ":"),
                          default=str
                      ) + "\n"
                  )

          print(f"Seasons included: {earliest_season}-{latest_season}")
          print(f"Model rows: {len(df):,}")
          print(f"Players: {df['player_id'].nunique():,}")

          PY

      - name: Show output size
        run: |
          ls -lh data/nfl_prop_model.txt
          wc -l data/nfl_prop_model.txt

      - name: Commit model data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/nfl_prop_model.txt

          git diff --cached --quiet || git commit -m "Update NFL prop model data"

          git push
